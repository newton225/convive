<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Convive</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
            background: #f5f4f2;
            color: #1b1917;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1b1917; color: #f5f4f2; }
            .muted { color: #b8b3ad; }
        }
        main { max-width: 26rem; text-align: center; }
        h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
        p { margin: 0 0 1rem; line-height: 1.5; }
        .muted { color: #6b6560; font-size: .9rem; }
        button {
            min-height: 44px;
            padding: 0 20px;
            border: 0;
            border-radius: 8px;
            background: #5b6bd6;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }
        button:focus-visible { outline: 3px solid #93a0ff; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <h1>Vous êtes hors ligne</h1>
        <p>Cette page a besoin du réseau. Votre billet et l'écran de scan déjà ouverts restent disponibles.</p>
        <p class="muted">You are offline. This page needs a network connection. A ticket or scan screen you already opened stays available.</p>
        <button type="button" onclick="location.reload()">Réessayer / Retry</button>
    </main>
</body>
</html>
