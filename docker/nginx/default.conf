# nginx du conteneur `web`. Il ne porte pas le TLS : un serveur de tete (nginx, Caddy ou Traefik de
# l'hote) recoit `*.domaine` avec le certificat generique et transmet ici en HTTP.
server {
    listen 80 default_server;
    # Tous les noms : le domaine de l'application et les sous-domaines des organisations. C'est
    # l'application qui reconnait l'organisation par le nom d'hote.
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Les depots de preuve sont limites a 5 Mo (CLAUDE.md) : un peu de marge pour le formulaire.
    client_max_body_size 8m;

    charset utf-8;

    # Le serveur de tete pose ces en-tetes ; Laravel les lit grace a TRUSTED_PROXIES.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Le site compile porte un nom contenant son empreinte : cache longue duree.
    location /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Resolveur interne de Docker. Avec une variable dans `fastcgi_pass`, nginx resout `app` a chaque
    # requete (toutes les 10 s au plus) : sans cela il garde l'adresse du conteneur `app` d'avant sa
    # recreation et repond 502 apres chaque livraison.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        # Les en-tetes de reponse (CSP a nonces, preChargement des fichiers du site, cookies) depassent
        # la memoire tampon par defaut : sans cela nginx repond 502 « upstream sent too big header ».
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 32k;
    }

    # Jamais de fichiers caches (.env, .git...) ; seul `.well-known` (certificats) passe.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
