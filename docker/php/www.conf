; Pool PHP-FPM du conteneur : on garde le pool par defaut (`www`) et on regle sa taille.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
; Les variables d'environnement du conteneur restent visibles de l'application.
clear_env = no
