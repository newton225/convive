; Reglages PHP de production du conteneur.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 6M
post_max_size = 8M
max_execution_time = 60
date.timezone = UTC

; Le code d'une image ne change pas : pas de verification des dates de fichiers.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
